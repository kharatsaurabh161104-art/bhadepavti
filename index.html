<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>लॉगिन — Onpoint Services भाडे पावती जनरेटर</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <!-- vercel-build:06d2368 -->

    <div class="login-card">
      <div class="brand-header">
        <img
          src="assets/logo.png"
          alt="Onpoint Services Logo"
          class="brand-logo"
        />
        <h1>Onpoint Services</h1>
        <p>भाडे चिठ्ठी / भाडे पत्र करारनामा जनरेटर</p>
      </div>

      <form id="loginForm" class="login-form">
        <div
          id="loginError"
          style="
            display: none;
            padding: 10px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #b91c1c;
            font-size: 13px;
            margin-bottom: 18px;
          "
        ></div>

        <div class="form-group">
          <label for="username" class="form-label">युझरनेम (Username)</label>
          <div class="input-wrapper">
            <svg
              class="input-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="@Onpoint_Services"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">पासवर्ड (Password)</label>
          <div class="input-wrapper">
            <svg
              class="input-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="toggle-password"
              title="पासवर्ड दाखवा/लपवा"
            >
              <svg
                id="eyeIcon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span>लॉगिन करा (Login)</span>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>

    <footer class="login-page-footer">
      All rights reserved to ePoint Services through SK Tech Services and
      Solutions @2026
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Redirect to dashboard if already logged in
        if (window.Auth) {
          window.Auth.redirectIfLoggedIn();
        }

        const loginForm = document.getElementById("loginForm");
        const userInput = document.getElementById("username");
        const passInput = document.getElementById("password");
        const errorDiv = document.getElementById("loginError");
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const loginBtn = document.getElementById("loginBtn");

        // Password toggle
        toggleBtn.addEventListener("click", () => {
          const isPass = passInput.type === "password";
          passInput.type = isPass ? "text" : "password";
        });

        // Submit
        loginForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          errorDiv.style.display = "none";

          loginBtn.disabled = true;
          const originalHtml = loginBtn.innerHTML;
          loginBtn.innerHTML = `<span>पडताळणी करत आहे...</span>`;

          try {
            const res = await window.Auth.login(
              userInput.value,
              passInput.value,
            );
            if (res.success) {
              window.location.href = "dashboard.html";
            } else {
              errorDiv.textContent = res.message;
              errorDiv.style.display = "block";
            }
          } catch (err) {
            errorDiv.textContent =
              "लॉगिन त्रुटी: " + (err.message || "त्रुटी आली");
            errorDiv.style.display = "block";
          } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = originalHtml;
          }
        });
      });
    </script>
  </body>
</html>
